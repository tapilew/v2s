name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: android-actions/setup-android@v3

      - name: Install the NDK QVAC is built against
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project and the QVAC worker bundle
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk v2s.apk

      - uses: actions/upload-artifact@v4
        with:
          name: v2s-apk
          path: v2s.apk

      - name: Publish the APK as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: V2S build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: v2s.apk
          body: |
            APK de Android para teléfonos arm64 (Android 10 o superior), generado desde ${{ github.sha }}.

            Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/v2s.apk

            Instalación: abre el archivo en el teléfono y permite instalar apps de esta fuente. La primera vez que abras cada modo, la app descarga su modelo; después funciona en modo avión.
